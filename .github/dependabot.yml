version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    # One pull request for all small updates keeps the number of reviews low.
    # A major update stays in its own pull request, because it may break the build.
    groups:
      maven-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: cargo
    directory: /native
    schedule:
      interval: weekly
    groups:
      cargo-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ['*']
