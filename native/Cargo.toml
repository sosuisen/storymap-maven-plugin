[package]
name = "storymap_ffi"
version = "0.0.0"
edition = "2024"
license = "MIT"
publish = false

[lib]
# A C library, for the Java side to load through FFM
crate-type = ["cdylib"]

[dependencies]
# The maximum card width comes in storymap 0.3.0, which is not on crates.io yet
storymap = { git = "https://github.com/sosuisen/storymap", rev = "dbd7dee4bd3df4224ace60d572ab0f5bb1ac1441", features = ["image"] }
