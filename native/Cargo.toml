[package]
name = "storymap_ffi"
version = "0.0.0"
edition = "2024"
license = "MIT"
publish = false

[lib]
# A C library, for the Java side to load through FFM
crate-type = ["cdylib"]

[dependencies]
# storymap 0.3.0 is not on crates.io yet, so the commit on main is used
storymap = { git = "https://github.com/sosuisen/storymap", rev = "d97f6dafefaf8b65cff744a0fce8a4a1733d919b", features = ["image"] }
