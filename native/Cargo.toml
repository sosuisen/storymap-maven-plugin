[package]
name = "storymap_ffi"
version = "0.0.0"
edition = "2024"
license = "MIT"
publish = false

[lib]
# A C library, for the Java side to load through FFM
crate-type = ["cdylib"]

[dependencies]
# The maximum card width comes in storymap 0.3.0, which is not on crates.io yet
storymap = { git = "https://github.com/sosuisen/storymap", rev = "f0a1e1779370ef6889f4895a8fc727fdf0b1f5d6", features = ["image"] }
